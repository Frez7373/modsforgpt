name: Build DostavkaRP 1.20.1

on:
  push:
    branches:
      - build/dostavkarp-1.20.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Forge 1.20.1 / Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Check out source payload
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dostavkarp"
          cat .dostavkarp-payload/part*.b64 | base64 --decode > "$RUNNER_TEMP/dostavkarp/source.tar.xz"
          tar -xJf "$RUNNER_TEMP/dostavkarp/source.tar.xz" -C "$RUNNER_TEMP/dostavkarp"
          test -f "$RUNNER_TEMP/dostavkarp/DostavkaRP/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.8
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.8-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.8-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.8-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.8/bin" >> "$GITHUB_PATH"

      - name: Configure ForgeGradle for the Modrinth repository
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["RUNNER_TEMP"]) / "dostavkarp" / "DostavkaRP"
          gradle_file = project / "build.gradle"
          source = gradle_file.read_text(encoding="utf-8")
          needle = """        forRepository {
                      maven {
                          name = 'Modrinth'
                          url = 'https://api.modrinth.com/maven'
                      }
                  }
                  filter {
          """
          replacement = """        forRepository {
                      maven {
                          name = 'Modrinth'
                          url = 'https://api.modrinth.com/maven'
                      }
                  }
                  forRepositories(fg.repository)
                  filter {
          """
          if needle not in source:
              raise SystemExit("Modrinth repository block did not match expected source")
          gradle_file.write_text(source.replace(needle, replacement, 1), encoding="utf-8")
          PY

      - name: Build mod
        shell: bash
        working-directory: ${{ runner.temp }}/dostavkarp/DostavkaRP
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DostavkaRP-1.20.1
          path: ${{ runner.temp }}/dostavkarp/DostavkaRP/build/libs/DostavkaRP-1.20.1.jar
          if-no-files-found: error
          retention-days: 7
