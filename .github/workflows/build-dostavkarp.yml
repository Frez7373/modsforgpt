name: Build DostavkaRP 1.20.1

on:
  push:
    branches:
      - build/dostavkarp-1.20.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Forge 1.20.1 / Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Check out source payload
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dostavkarp"
          cat .dostavkarp-payload/part*.b64 | base64 --decode > "$RUNNER_TEMP/dostavkarp/source.tar.xz"
          tar -xJf "$RUNNER_TEMP/dostavkarp/source.tar.xz" -C "$RUNNER_TEMP/dostavkarp"
          test -f "$RUNNER_TEMP/dostavkarp/DostavkaRP/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.8
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.8-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.8-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.8-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.8/bin" >> "$GITHUB_PATH"

      - name: Apply Minecraft 1.20.1 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["RUNNER_TEMP"]) / "dostavkarp" / "DostavkaRP"

          # ForgeGradle needs its own repository added for Modrinth dependency remapping.
          gradle_file = project / "build.gradle"
          gradle_source = gradle_file.read_text(encoding="utf-8")
          marker = "        filter {"
          if marker not in gradle_source:
              raise SystemExit("Modrinth repository filter marker not found")
          gradle_source = gradle_source.replace(
              marker, "        forRepositories(fg.repository)\n" + marker, 1
          )
          gradle_file.write_text(gradle_source, encoding="utf-8")

          # MinecraftServer does not expose getLogger() in the 1.20.1 mapped API.
          mod_file = project / "src/main/java/com/frez7373/dostavkarp/DostavkaRPMod.java"
          mod_source = mod_file.read_text(encoding="utf-8")
          if "public static final Logger LOGGER" not in mod_source:
              mod_source = mod_source.replace(
                  "import net.minecraft.server.level.ServerPlayer;\n",
                  "import net.minecraft.server.level.ServerPlayer;\n"
                  "import com.mojang.logging.LogUtils;\n"
                  "import org.slf4j.Logger;\n",
                  1,
              )
              mod_source = mod_source.replace(
                  '    public static final String MOD_ID = "dostavkarp";',
                  '    public static final String MOD_ID = "dostavkarp";\n'
                  '    public static final Logger LOGGER = LogUtils.getLogger();',
                  1,
              )
          mod_source = mod_source.replace("event.getServer().getLogger()", "LOGGER")
          mod_source = mod_source.replace("player.serverLevel().getServer().getLogger()", "LOGGER")
          mod_file.write_text(mod_source, encoding="utf-8")

          for relative in (
              "shift/ShiftService.java",
              "command/PanelActionHandler.java",
          ):
              java_file = project / "src/main/java/com/frez7373/dostavkarp" / relative
              java_source = java_file.read_text(encoding="utf-8")
              package_line = (
                  "package com.frez7373.dostavkarp.shift;\n"
                  if relative.startswith("shift/")
                  else "package com.frez7373.dostavkarp.command;\n"
              )
              if "import com.frez7373.dostavkarp.DostavkaRPMod;" not in java_source:
                  java_source = java_source.replace(
                      package_line,
                      package_line + "\nimport com.frez7373.dostavkarp.DostavkaRPMod;\n",
                      1,
                  )
              java_source = java_source.replace(
                  "player.serverLevel().getServer().getLogger()",
                  "DostavkaRPMod.LOGGER",
              )
              java_file.write_text(java_source, encoding="utf-8")

          # TextDisplay setters are not public in Forge 1.20.1. Use invisible,
          # invulnerable marker ArmorStands with visible custom-name labels instead.
          marker_file = project / "src/main/java/com/frez7373/dostavkarp/marker/MarkerManager.java"
          marker_file.write_text(r'''package com.frez7373.dostavkarp.marker;

          import java.util.List;

          import com.frez7373.dostavkarp.data.DeliveryPoint;
          import com.frez7373.dostavkarp.data.WorldData;
          import com.frez7373.dostavkarp.data.WorldPosition;

          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.decoration.ArmorStand;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.level.Level;

          /** Non-colliding invisible ArmorStand nameplates used as delivery markers. */
          public final class MarkerManager {
              public static final String MARKER_TAG = "dostavkarp_marker";
              private static final String DATA_KEY = "DostavkaRPMarkerId";

              private MarkerManager() { }

              public static void refresh(MinecraftServer server, WorldData data) {
                  if (data.base() != null) {
                      removeById(server, data.base(), "base");
                      spawnBase(server, data.base());
                  }
                  for (DeliveryPoint point : data.points()) {
                      removeById(server, point.position(), pointKey(point.id()));
                      spawnPoint(server, point);
                  }
              }

              public static void spawnBase(MinecraftServer server, WorldPosition position) {
                  ServerLevel level = getLevel(server, position);
                  if (level == null) return;
                  removeById(server, position, "base");
                  spawnText(level, position.x(), position.y() + 2.25, position.z(), "§e§lБАЗА ДОСТАВКИ", "base:0");
              }

              public static void spawnPoint(MinecraftServer server, DeliveryPoint point) {
                  ServerLevel level = getLevel(server, point.position());
                  if (level == null) return;
                  String id = pointKey(point.id());
                  removeById(server, point.position(), id);
                  if (!point.active()) return;
                  spawnText(level, point.position().x(), point.position().y() + 2.28, point.position().z(), "§b§lТОЧКА ДОСТАВКИ", id + ":0");
                  spawnText(level, point.position().x(), point.position().y() + 1.88, point.position().z(), "§f" + point.name(), id + ":1");
              }

              public static void removePoint(MinecraftServer server, DeliveryPoint point) {
                  removeById(server, point.position(), pointKey(point.id()));
              }

              public static void removeBase(MinecraftServer server, WorldPosition position) {
                  if (position != null) removeById(server, position, "base");
              }

              private static String pointKey(String id) { return "point:" + id; }

              private static void spawnText(ServerLevel level, double x, double y, double z, String text, String id) {
                  ArmorStand marker = EntityType.ARMOR_STAND.create(level);
                  if (marker == null) return;
                  marker.setCustomName(Component.literal(text));
                  marker.setCustomNameVisible(true);
                  marker.setInvisible(true);
                  marker.setNoGravity(true);
                  marker.noPhysics = true;
                  marker.setInvulnerable(true);
                  marker.setSilent(true);
                  marker.setPos(x + 0.5, y, z + 0.5);
                  marker.addTag(MARKER_TAG);
                  marker.getPersistentData().putString(DATA_KEY, id);
                  level.addFreshEntity(marker);
              }

              private static void removeById(MinecraftServer server, WorldPosition position, String keyPrefix) {
                  ServerLevel level = getLevel(server, position);
                  if (level == null) return;
                  level.getChunkAt(position.blockPos());
                  AABB search = new AABB(position.x() - 12, position.y() - 6, position.z() - 12,
                          position.x() + 12, position.y() + 8, position.z() + 12);
                  List<ArmorStand> old = level.getEntitiesOfClass(ArmorStand.class, search,
                          entity -> entity.getTags().contains(MARKER_TAG)
                                  && entity.getPersistentData().getString(DATA_KEY).startsWith(keyPrefix));
                  old.forEach(ArmorStand::discard);
              }

              private static ServerLevel getLevel(MinecraftServer server, WorldPosition position) {
                  try {
                      ResourceLocation dimensionId = new ResourceLocation(position.dimension());
                      ResourceKey<Level> key = ResourceKey.create(Registries.DIMENSION, dimensionId);
                      return server.getLevel(key);
                  } catch (Exception exception) {
                      return null;
                  }
              }
          }
          ''', encoding="utf-8")
          PY

      - name: Fix Immersive Vehicles driver-seat detection
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["RUNNER_TEMP"]) / "dostavkarp" / "DostavkaRP"
          source = '''package com.frez7373.dostavkarp.vehicle;\n\nimport com.frez7373.dostavkarp.data.WorldPosition;\n\nimport net.minecraft.server.level.ServerPlayer;\nimport net.minecraftforge.fml.ModList;\n\n/** Optional adapter for Immersive Vehicles. The IV-specific classes are isolated in a lazy nested class. */\npublic final class VehicleCompat {\n    public record VehicleInfo(String modelId, WorldPosition position) { }\n\n    private VehicleCompat() { }\n\n    public static VehicleInfo getCurrentVehicle(ServerPlayer player) {\n        if (player == null || !ModList.get().isLoaded("mts")) return null;\n        try {\n            return IVAccess.read(player);\n        } catch (LinkageError | RuntimeException exception) {\n            return null;\n        }\n    }\n\n    private static final class IVAccess {\n        private static VehicleInfo read(ServerPlayer player) {\n            if (!(player.getVehicle() instanceof mcinterface1201.BuilderEntityLinkedSeat seat)) return null;\n\n            // In MTS, the Minecraft seat wrapper points to PartSeat, not directly to the vehicle.\n            // PartSeat.vehicleOn is the owning EntityVehicleF_Physics instance.\n            minecrafttransportsimulator.entities.components.AEntityB_Existing internal = seat.entity;\n            minecrafttransportsimulator.entities.instances.EntityVehicleF_Physics vehicle = null;\n            if (internal instanceof minecrafttransportsimulator.entities.instances.PartSeat partSeat) {\n                vehicle = partSeat.vehicleOn;\n            } else if (internal instanceof minecrafttransportsimulator.entities.instances.EntityVehicleF_Physics directVehicle) {\n                // Keep compatibility with MTS seats/wrappers that expose the vehicle directly.\n                vehicle = directVehicle;\n            }\n            if (vehicle == null || vehicle.definition == null) return null;\n\n            String packId = vehicle.definition.packID;\n            String systemName = vehicle.definition.systemName;\n            if (packId == null || packId.isBlank() || systemName == null || systemName.isBlank()) return null;\n\n            String id = packId + ":" + systemName;\n            WorldPosition position = WorldPosition.of(player.serverLevel(), vehicle.position.x, vehicle.position.y, vehicle.position.z);\n            return new VehicleInfo(id, position);\n        }\n    }\n}\n
          '''
          target = project / "src/main/java/com/frez7373/dostavkarp/vehicle/VehicleCompat.java"
          target.write_text(source, encoding="utf-8")
          PY

      - name: Lower delivery labels and draw CRMP-style point rings
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          project = Path(os.environ["RUNNER_TEMP"]) / "dostavkarp" / "DostavkaRP"
          marker_file = project / "src/main/java/com/frez7373/dostavkarp/marker/MarkerManager.java"
          marker_b64 = """"""
          marker_file.write_bytes(base64.b64decode(marker_b64))

          mod_file = project / "src/main/java/com/frez7373/dostavkarp/DostavkaRPMod.java"
          mod_source = mod_file.read_text(encoding="utf-8")
          tick_line = "                    ShiftService.tick(event.getServer());"
          tick_addition = tick_line + "\n                    MarkerManager.tick(event.getServer(), WorldData.get(event.getServer()));"
          if "MarkerManager.tick(event.getServer()" not in mod_source:
              if tick_line not in mod_source:
                  raise SystemExit("Server tick hook was not found")
              mod_source = mod_source.replace(tick_line, tick_addition, 1)
          mod_file.write_text(mod_source, encoding="utf-8")
          PY

      - name: Apply external currency denomination templates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          payload = ""
          script = gzip.decompress(base64.b64decode(payload))
          target = Path(os.environ["RUNNER_TEMP"]) / "apply_currency_patch.py"
          target.write_bytes(script)
          PY
          python3 "$RUNNER_TEMP/apply_currency_patch.py" "$RUNNER_TEMP/dostavkarp/DostavkaRP"

      - name: Build mod
        shell: bash
        working-directory: ${{ runner.temp }}/dostavkarp/DostavkaRP
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DostavkaRP-1.20.1
          path: ${{ runner.temp }}/dostavkarp/DostavkaRP/build/libs/DostavkaRP-1.20.1.jar
          if-no-files-found: error
          retention-days: 7
